[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JellyFishJuggler", email = "guptasrijan85@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "fastapi>=0.162.6",
    "langchain>=1.5.0",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.21",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
chatbot = "chatbot:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
